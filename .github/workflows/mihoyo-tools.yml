name: MihoyoTools

on:
  schedule:
    - cron: '00 00 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production

    env:
      GITHUB_ACTIONS: 'true'
      ALLOW_GITHUB_ACTIONS: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare config
        env:
          MIHOYO_CONFIG: ${{ secrets.MIHOYO_CONFIG }}
        run: |
          mkdir -p config
          if [ -n "$MIHOYO_CONFIG" ]; then
            printf '%s' "$MIHOYO_CONFIG" > config/config.yaml
          else
            echo "Missing MIHOYO_CONFIG secret. Create a config/config.yaml content in repository secrets."
            exit 1
          fi

      - name: Run MihoyoTools
        run: |
          python main.py
